<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," id="favicon" />
        <title>Расписание</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="page">
            <div class="content">
                <div class="main">
                    <div class="header-container">
                        <button class="back-button" onclick="handleBackButton()">←</button>
                        <h1>📅 Расписание</h1>
                        <div style="width: 40px">
                            <button
                                id="theme-toggle-button"
                                class="theme-toggle-button"
                                onclick="toggleTheme()"
                                title="Переключить тему"
                            >
                                🌙
                            </button>
                        </div>
                    </div>
                    <div class="section">
                        <div class="contrast-control">
                            <label for="contrast-slider">Контрастность:</label>
                            <input
                                type="range"
                                id="contrast-slider"
                                min="0"
                                max="100"
                                value="100"
                                oninput="updateContrast(this.value)"
                            />
                            <span class="contrast-value" id="contrast-value">100%</span>
                        </div>
                        <div class="schedule-container">
                            <table class="schedule-table" id="schedule-table">
                                <thead>
                                    <tr>
                                        <th>Урок</th>
                                        <th>Начало</th>
                                        <th>Конец</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="section" id="lessons-list-section" style="margin-top: 20px">
                        <div id="lessons-list-container" class="lessons-list-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="lesson-modal" class="modal">
            <div class="modal-content">
                <h3 id="modal-title">Информация об уроке</h3>
                <div id="modal-info" class="modal-info"></div>
                <div class="modal-buttons">
                    <button class="close" onclick="closeModal()">Закрыть</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
